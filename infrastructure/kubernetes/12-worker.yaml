# Worker: outbox dispatch, webhook delivery, rollups, crons.
# Long-lived (arq blocks); scale on queue depth via the arq queue-length
# metric once exported, or CPU as a starter.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-worker
  namespace: synapse
  labels:
    app: synapse-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: synapse-worker
  template:
    metadata:
      labels:
        app: synapse-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Local-disk storage fallback + tmp; per pod. Use S3 for real deployments.
        - name: storage
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # White-label (optional): mount your branding kit from a ConfigMap —
        #   kubectl create configmap synapse-branding -n synapse --from-file=branding/
        # and uncomment this volume, the mount and the env var below.
        # - name: branding
        #   configMap:
        #     name: synapse-branding
      containers:
        - name: worker
          image: synapse-saas/api:latest # same image; different entrypoint
          command: ["synapse-worker"]
          envFrom:
            - configMapRef:
                name: synapse-config
            - secretRef:
                name: synapse-secrets
          # env:
          #   - name: SYNAPSE_BRANDING_FILE
          #     value: /branding/branding.yaml
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: storage
              mountPath: /data/storage
            - name: tmp
              mountPath: /tmp
            # - name: branding
            #   mountPath: /branding
            #   readOnly: true
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synapse-worker
  namespace: synapse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synapse-worker
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
