# Web console (Next.js standalone). Serves static + SPA shell on :3000.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-web
  namespace: synapse
  labels:
    app: synapse-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: synapse-web
  template:
    metadata:
      labels:
        app: synapse-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: web
          image: synapse-saas/web:latest # replace with your registry
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.example.com"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: synapse-web
  namespace: synapse
spec:
  selector:
    app: synapse-web
  ports:
    - port: 80
      targetPort: http
