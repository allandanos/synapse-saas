# Web console (Next.js standalone) on :3000. The image is environment-agnostic:
# the API URL is runtime env, and the brand (name, logo, colours) is read from
# the API's GET /v1/branding — rebrand by changing the API's branding kit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-web
  namespace: synapse
  labels:
    app: synapse-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: synapse-web
  template:
    metadata:
      labels:
        app: synapse-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: web
          image: synapse-saas/web:latest # replace with your registry
          ports:
            - containerPort: 3000
              name: http
          env:
            # The API as BROWSERS reach it (assets and API calls use this).
            - name: SYNAPSE_API_URL
              value: "https://api.example.com"
            # The API as the console's server reaches it (branding fetch);
            # in-cluster Service DNS skips the ingress round trip.
            - name: SYNAPSE_API_INTERNAL_URL
              value: "http://synapse-api.synapse.svc.cluster.local"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: synapse-web
  namespace: synapse
spec:
  selector:
    app: synapse-web
  ports:
    - port: 80
      targetPort: http
