# TEMPLATE — copy to 02-secret.yaml and fill in. 02-secret.yaml is gitignored.
#
#   cp 02-secret.example.yaml 02-secret.yaml   # then edit
#
# For real deployments prefer a sealed secret / external secrets operator /
# `kubectl create secret` over committing this file.
apiVersion: v1
kind: Secret
metadata:
  name: synapse-secrets
  namespace: synapse
type: Opaque
stringData:
  SYNAPSE_SECRET_KEY: "change-me-openssl-rand-base64-32"
  SYNAPSE_DATABASE_URL: "postgresql+asyncpg://synapse:PASSWORD@postgres-host:5432/synapse"
  SYNAPSE_REDIS_URL: "redis://redis-host:6379/0"
  # Billing (only the provider you use)
  SYNAPSE_STRIPE_SECRET_KEY: ""
  SYNAPSE_STRIPE_WEBHOOK_SECRET: ""
  SYNAPSE_MANUAL_WEBHOOK_TOKEN: ""
  # Storage (optional; unset = local disk)
  SYNAPSE_S3_BUCKET: ""
  SYNAPSE_S3_ACCESS_KEY_ID: ""
  SYNAPSE_S3_SECRET_ACCESS_KEY: ""
  # Tracing (optional)
  SYNAPSE_OTEL_EXPORTER_ENDPOINT: ""
