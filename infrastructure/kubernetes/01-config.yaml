# Non-secret settings for every workload. Secret values (DB URL, keys) come
# from 02-secret.yaml — create it from .env, never commit real values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-config
  namespace: synapse
data:
  SYNAPSE_ENV: "production"
  SYNAPSE_WEB_ORIGIN: "https://console.example.com"
  SYNAPSE_AUTO_SYNC_PLANS: "true"
  SYNAPSE_BILLING_PROVIDER: "manual"
  SYNAPSE_IDENTITY_PROVIDER: "local"
  SYNAPSE_METRICS_ENABLED: "true"
  SYNAPSE_DEFAULT_PLAN_KEY: "free"
  # Auth brute-force protection. The app REFUSES to start in production with
  # looser values than 100/min per IP or 20/min per identity.
  SYNAPSE_AUTH_RATE_LIMIT_PER_IP: "20"
  SYNAPSE_AUTH_RATE_LIMIT_PER_IDENTITY: "5"
  SYNAPSE_AUTH_RATE_WINDOW_SECONDS: "60"
  SYNAPSE_TENANT_ISOLATION: "app"
  SYNAPSE_AUDIT_RETENTION_DAYS: "365"
  SYNAPSE_BILLING_CURRENCY: "PHP"
  # Object storage. With replicas > 1 the local-disk fallback is per pod, so a
  # bucket is REQUIRED for anything but a single-replica trial (README).
  SYNAPSE_S3_REGION: "us-east-1"
  SYNAPSE_S3_ENDPOINT_URL: ""      # e.g. https://<account>.r2.cloudflarestorage.com
  SYNAPSE_STORAGE_ROOT: "/data/storage"
  # Email (credentials in 02-secret.yaml). none | starttls | ssl
  SYNAPSE_NOTIFIER: "smtp"
  SYNAPSE_SMTP_HOST: ""
  SYNAPSE_SMTP_PORT: "587"
  SYNAPSE_SMTP_TLS: "starttls"
  SYNAPSE_SMTP_FROM: "noreply@example.com"
  # Observability: empty endpoint ⇒ tracing inert
  SYNAPSE_OTEL_EXPORTER_ENDPOINT: ""
  SYNAPSE_OTEL_SERVICE_NAME: "synapse-saas"
  # Reverse-proxy chain that may set X-Forwarded-For (CIDRs, comma-separated)
  SYNAPSE_TRUSTED_PROXIES: "10.0.0.0/8"
  SYNAPSE_COOKIE_SECURE: "true"
