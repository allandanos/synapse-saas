# Non-secret settings for every workload. Secret values (DB URL, keys) come
# from 02-secret.yaml — create it from .env, never commit real values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-config
  namespace: synapse
data:
  SYNAPSE_ENV: "production"
  SYNAPSE_WEB_ORIGIN: "https://console.example.com"
  SYNAPSE_AUTO_SYNC_PLANS: "true"
  SYNAPSE_BILLING_PROVIDER: "manual"
  SYNAPSE_IDENTITY_PROVIDER: "local"
  SYNAPSE_METRICS_ENABLED: "true"
  SYNAPSE_DEFAULT_PLAN_KEY: "free"
  # Auth brute-force protection. The app REFUSES to start in production with
  # looser values than 100/min per IP or 20/min per identity.
  SYNAPSE_AUTH_RATE_LIMIT_PER_IP: "20"
  SYNAPSE_AUTH_RATE_LIMIT_PER_IDENTITY: "5"
  SYNAPSE_AUTH_RATE_WINDOW_SECONDS: "60"
  SYNAPSE_TENANT_ISOLATION: "app"
  SYNAPSE_AUDIT_RETENTION_DAYS: "365"
  SYNAPSE_BILLING_CURRENCY: "PHP"
