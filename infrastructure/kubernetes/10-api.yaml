# API deployment — 2 replicas minimum, autoscales on CPU.
# Probes: /healthz (liveness) and /readyz (readiness, checks DB+Redis).
# /metrics is scraped via the prometheus.io annotations (Prometheus Operator
# or annotation-based discovery picks it up without extra RBAC).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-api
  namespace: synapse
  labels:
    app: synapse-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: synapse-api
  template:
    metadata:
      labels:
        app: synapse-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: api
          image: synapse-saas/api:latest # replace with your registry
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: synapse-config
            - secretRef:
                name: synapse-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: synapse-api
  namespace: synapse
spec:
  selector:
    app: synapse-api
  ports:
    - port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synapse-api
  namespace: synapse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synapse-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
