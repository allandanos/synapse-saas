name: Release

# Tag `vX.Y.Z` ⇒ publish the framework + clients (ADR 0011).
#   PyPI: trusted publishing (configure the `synapse-saas` and
#         `synapse-saas-client` projects to trust this repo/workflow).
#   npm:  NPM_TOKEN secret (or provenance via `npm publish --provenance`).
#   Maven Central: MAVEN_CENTRAL_USERNAME/PASSWORD + GPG_PRIVATE_KEY/GPG_PASSPHRASE
#         secrets and a verified `dev.synapse` namespace on central.sonatype.com.
#   Go:   the module is consumed by tag — `sdk/go/vX.Y.Z` is pushed by this job.
#   Docker Hub: synapse-saas-{api,worker,web}:X.Y.Z + :latest, linux/amd64 + arm64.
#         Secrets DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (an access token with
#         read/write on the namespace); repository variable DOCKERHUB_NAMESPACE
#         (default `allandanos`) picks the namespace independently of the login,
#         so moving to an organisation is a variable change. Images are pushed
#         ONLY on a `v*` tag push: a manual run (`workflow_dispatch`) builds both
#         platforms but never pushes, even with dry_run=false — the tag is what
#         ties `:X.Y.Z` and `:latest` to a reviewed commit (unlike the PyPI job,
#         which honours dry_run=false on a manual run).
# Every step is a dry run until the matching secret/trust exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  python:
    name: PyPI (framework + client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build framework wheel + sdist
        run: uv build --out-dir dist
      - name: Build client wheel + sdist
        run: uv build --out-dir dist-client sdk/python
      - name: Smoke-install the framework wheel and migrate from an empty directory
        run: |
          python -m venv /tmp/smoke && /tmp/smoke/bin/pip install -q dist/*.whl
          cd /tmp && /tmp/smoke/bin/synapse-cli new smoke-app --list-templates
      - name: Publish framework to PyPI
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
      - name: Publish client to PyPI
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-client
          skip-existing: true

  npm:
    name: npm (@synapse-saas/client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm build
      - name: Publish (dry run without a token)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public --provenance
          fi

  maven:
    name: Maven Central (dev.synapse:synapse-saas-client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify + package
        run: mvn -q -B verify
      - name: Deploy to Central (needs the dev.synapse namespace + secrets)
        if: github.event_name == 'push' && inputs.dry_run != true
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ]; then echo "no Central credentials — skipping deploy"; exit 0; fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          mvn -q -B -Pcentral deploy -Dgpg.passphrase="$GPG_PASSPHRASE"

  go:
    name: Go module tag (sdk/go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: cd sdk/go && go vet ./... && go test ./...
      - name: Push the nested module tag
        if: github.event_name == 'push'
        run: |
          TAG="sdk/go/${GITHUB_REF_NAME}"
          git tag "$TAG" && git push origin "$TAG"

  docker:
    name: Docker Hub (synapse-saas-${{ matrix.image }})
    runs-on: ubuntu-latest
    # arm64 builds run under QEMU (the console's `next build` especially is slow).
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, web]
    env:
      IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || 'allandanos' }}/synapse-saas-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      # The tag, the Python package and the console must all name the same
      # release; on a manual run the pyproject version is the one built.
      - name: Version gate
        id: version
        run: |
          set -euo pipefail
          py="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          web="$(python3 -c 'import json; print(json.load(open("apps/web/package.json"))["version"])')"
          if [ "$py" != "$web" ]; then
            echo "::error::pyproject.toml is $py but apps/web/package.json is $web"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$py" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the package version $py"; exit 1
            fi
          fi
          echo "version=$py" >> "$GITHUB_OUTPUT"

      # Secrets cannot appear in `if:`; expose the decision as a step output.
      - name: Push gate
        id: gate
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$DRY_RUN" != "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "pushing $IMAGE:${{ steps.version.outputs.version }}"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "dry run: building $IMAGE for both platforms, pushing nothing"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on a release tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.gate.outputs.push == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=synapse-saas-${{ matrix.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
