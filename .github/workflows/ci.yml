name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  # ── Static checks: fast, no services ────────────────────────────────────────
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Ruff check
        run: uv run ruff check src tests examples scripts

      - name: Ruff format
        run: uv run ruff format --check src tests examples scripts

      - name: Import contracts
        run: uv run lint-imports

      - name: mypy (strict)
        run: uv run mypy src

  # ── Unit tests: no database required ────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Run unit tests
        run: uv run pytest -m 'not pg' --no-cov

  # ── Integration + coverage: real Postgres/Redis service containers ─────────
  integration:
    name: Integration & coverage
    runs-on: ubuntu-latest
    needs: [lint, unit]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U synapse -d synapse"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      SYNAPSE_DATABASE_URL: postgresql+asyncpg://synapse:synapse@localhost:5433/synapse
      SYNAPSE_REDIS_URL: ""
      SYNAPSE_SECRET_KEY: ci-only-secret-key-32-bytes-minimum-ok!

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Run full suite with coverage gate
        run: uv run pytest -m "" --cov=src/synapse_saas --cov-fail-under=80

  # ── Integration under real RLS: API as a NOBYPASSRLS role, policies live ───
  integration-rls:
    name: Integration (RLS-subject role)
    runs-on: ubuntu-latest
    needs: [lint, unit]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U synapse -d synapse"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      OWNER_URL: postgresql+asyncpg://synapse:synapse@localhost:5433/synapse
      APP_URL: postgresql+asyncpg://synapse_app:synapse_app@localhost:5433/synapse
      SYNAPSE_REDIS_URL: ""
      SYNAPSE_SECRET_KEY: ci-only-secret-key-32-bytes-minimum-ok!

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Migrate as owner
        run: SYNAPSE_DATABASE_URL="$OWNER_URL" uv run synapse-cli migrate

      - name: Provision the RLS-subject role
        run: >-
          SYNAPSE_DATABASE_URL="$OWNER_URL" SYNAPSE_APP_ROLE_PASSWORD=synapse_app
          uv run synapse-cli db provision-app-role --role synapse_app

      - name: Run integration suite as the subject role
        env:
          SYNAPSE_DATABASE_URL: postgresql+asyncpg://synapse_app:synapse_app@localhost:5433/synapse
          SYNAPSE_WORKER_DATABASE_URL: postgresql+asyncpg://synapse:synapse@localhost:5433/synapse
          SYNAPSE_TENANT_ISOLATION: app_and_rls
        run: uv run pytest -m pg --no-cov

  # ── Console build: catch TS/Next errors ────────────────────────────────────
  web:
    name: Console build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # No API in this job: the build must never need one (runtime config).
      - name: Build
        run: pnpm build

  # ── Contract: routers ⇒ contracts/openapi-v1.json must be committed ────────
  contract:
    name: REST contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: OpenAPI contract is up to date
        env:
          SYNAPSE_REDIS_URL: ""
        run: uv run python scripts/export_openapi.py --check

      - name: Docs cover every operation and the event catalog is generated
        env:
          SYNAPSE_REDIS_URL: ""
        run: uv run python scripts/check_docs.py --check

      - name: Event + problem contracts are up to date
        env:
          SYNAPSE_REDIS_URL: ""
        run: uv run python scripts/export_contracts.py --check

  # ── SDKs: every client's unit suite + every example compiles ─────────────
  sdk:
    name: SDKs (python, typescript, go, java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Every contract operation has a method in every SDK
        run: uv run python scripts/sdk_coverage.py --check
      - name: Python client
        working-directory: sdk/python
        run: uv run --with pytest --with pytest-asyncio --with respx pytest -q -o addopts="" -o asyncio_mode=auto --rootdir . test_client.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: TypeScript client
        working-directory: sdk/typescript
        run: pnpm install --frozen-lockfile && pnpm test && pnpm build
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Go client + examples
        run: |
          (cd sdk/go && go vet ./... && go test ./...)
          for d in examples/go/*/; do (cd "$d" && go build . && go vet .); done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Java client + examples
        run: |
          (cd sdk/java && mvn -q -B -DskipTests install && mvn -q -B test)
          for d in examples/java/*/; do (cd "$d" && mvn -q -B -DskipTests compile); done

  # ── Conformance: the contract, exercised end to end (in-process here; any base URL via env) ──
  conformance:
    name: Conformance suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U synapse -d synapse_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      SYNAPSE_DATABASE_URL: postgresql+asyncpg://synapse:synapse@localhost:5434/synapse_test
      SYNAPSE_REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-groups --frozen
      - run: uv run pytest tests/conformance -m "" --no-cov -q

  # ── Fine-grained authz: the generated model + tuple sync against a real OpenFGA ──
  integration-fga:
    name: Integration (OpenFGA)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U synapse -d synapse_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      SYNAPSE_DATABASE_URL: postgresql+asyncpg://synapse:synapse@localhost:5434/synapse_test
      SYNAPSE_REDIS_URL: ""
      SYNAPSE_OPENFGA_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      # Not a `services:` entry: the openfga image needs the `run` argument
      # (its entrypoint alone prints the CLI help and exits), and job services
      # cannot pass a command. Same in-memory datastore as docker-compose.yml.
      - name: Start OpenFGA (in-memory datastore)
        run: docker run -d --name openfga -p 8081:8080 openfga/openfga:latest run
      - name: Wait for OpenFGA
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "OpenFGA did not become healthy"; docker logs openfga; exit 1
      - name: Parity + end-to-end against OpenFGA
        run: uv run pytest -m fga --no-cov -q

  # ── Scaffold: a generated product installs, migrates both branches, and passes its own tests ──
  scaffold-smoke:
    name: Scaffold smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U synapse -d synapse_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      SYNAPSE_DATABASE_URL: postgresql+asyncpg://synapse:synapse@localhost:5434/synapse_test
      SYNAPSE_REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the framework
        run: uv sync --all-groups --frozen
      - name: Generate a product against this checkout
        run: uv run synapse-cli new demo-product --dir /tmp --framework-path "$GITHUB_WORKSPACE"
      - name: The product installs, migrates, and passes its tests
        working-directory: /tmp/demo-product
        run: |
          uv sync
          uv run python -m demo_product.migrate upgrade heads
          uv run pytest -q -m ""
      - name: The product's compose file (api, worker, migrate, published console) is valid
        working-directory: /tmp/demo-product
        run: |
          cp .env.example .env
          docker compose config -q
          services="$(docker compose config --services | sort | tr '\n' ' ')"
          echo "services: $services"
          test "$services" = "api migrate postgres redis web worker "

  # ── Images: no secrets baked, correct entrypoints, writable storage ────────
  docker-image:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t synapse-api:ci .

      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t synapse-worker:ci .

      - name: Assert no env files or dev artifacts in the API image
        run: |
          docker run --rm synapse-api:ci sh -c '
            set -e
            test ! -e /app/.env
            test ! -e /app/.git
            test ! -d /app/apps/web
            test ! -d /app/tests
            test -w /data/storage
            echo "image hygiene OK"'

      - name: Assert entrypoints
        run: |
          test "$(docker inspect --format '{{join .Config.Cmd " "}}' synapse-api:ci)" = "synapse-api"
          test "$(docker inspect --format '{{join .Config.Cmd " "}}' synapse-worker:ci)" = "synapse-worker"

      - name: API image starts (health)
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SYNAPSE_DATABASE_URL=postgresql+asyncpg://x:x@localhost:1/x \
            -e SYNAPSE_REDIS_URL= -e SYNAPSE_AUTO_SYNC_PLANS=false synapse-api:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/healthz && break; sleep 1; done
          curl -sf http://localhost:8000/healthz
          docker rm -f api

      - name: Build console image
        run: docker build -f apps/web/Dockerfile -t synapse-web:ci .

      - name: Console image bakes in no API URL (runtime config only)
        run: docker run --rm synapse-web:ci sh -c 'test -d .next/static && ! grep -rl "localhost:8000" .next/static'

      - name: Console image starts without an API (health)
        run: |
          docker run -d --name web -p 3000:3000 -e SYNAPSE_API_URL=http://localhost:8000 synapse-web:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/healthz && break; sleep 1; done
          curl -sf http://localhost:3000/healthz
          docker rm -f web

  # ── Published-images kit: deploy/compose runs as shipped, rebranded at runtime ──
  compose-kit-smoke:
    name: Compose kit smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYNAPSE_IMAGE_PREFIX: ci
      SYNAPSE_VERSION: ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The kit runs api, worker and migrate from the api image (the worker
      # image differs only in its CMD), so only two images are needed here.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: ci/synapse-saas-api:ci
          cache-from: type=gha,scope=synapse-saas-api
          cache-to: type=gha,mode=max,scope=synapse-saas-api

      - name: Build console image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: ci/synapse-saas-web:ci
          cache-from: type=gha,scope=synapse-saas-web
          cache-to: type=gha,mode=max,scope=synapse-saas-web

      - name: Configure the kit (.env from the example, a real secret, a new brand name)
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          echo "SYNAPSE_SECRET_KEY=$(openssl rand -base64 48)" >> .env
          sed -i 's/^name: .*/name: Acme Widgets/' branding/branding.yaml
          grep -q '^name: Acme Widgets$' branding/branding.yaml

      - name: Start the stack
        working-directory: deploy/compose
        run: docker compose up -d --wait --wait-timeout 300

      # Here-strings rather than `curl | grep -q`: grep exiting early would
      # SIGPIPE curl and trip pipefail. GET with -D, not -I: the asset route
      # answers GET only (HEAD is a 405 problem).
      - name: API serves the mounted branding
        run: |
          set -euo pipefail
          curl -sf http://localhost:8000/healthz
          test "$(curl -sf http://localhost:8000/v1/branding | jq -r .name)" = "Acme Widgets"
          test "$(curl -sf http://localhost:8000/v1/meta | jq -r .product)" = "Acme Widgets"
          logo_headers="$(curl -sf -D - -o /dev/null http://localhost:8000/v1/branding/assets/logo.svg)"
          grep -qi '^content-type: image/svg+xml' <<<"$logo_headers"
          grep -qi '^x-content-type-options: nosniff' <<<"$logo_headers"
          # Anything the YAML does not reference is a 404 problem document.
          nope_headers="$(curl -s -D - -o /tmp/nope.json http://localhost:8000/v1/branding/assets/nope.svg)"
          grep -q '^HTTP/[0-9.]* 404' <<<"$nope_headers"
          grep -qi '^content-type: application/json' <<<"$nope_headers"
          jq -e '.status == 404 and (.type | startswith("https://synapse-saas.dev/problems/"))' /tmp/nope.json

      - name: Console renders the brand from the API (no rebuild)
        run: |
          set -euo pipefail
          curl -sf http://localhost:3000/healthz
          # A console's very first render falls back to the neutral "Console"
          # if the first branding fetch exceeds 2 s; the next render has it.
          for i in $(seq 1 10); do
            login="$(curl -sf http://localhost:3000/login)"
            grep -q "Acme Widgets" <<<"$login" && break
            sleep 2
          done
          grep -q "Acme Widgets" <<<"$login"
          grep -q -- "--brand-primary" <<<"$login"
          landing="$(curl -sf http://localhost:3000/)"
          grep -q "Powered by" <<<"$landing"

      - name: Logs
        if: always()
        working-directory: deploy/compose
        run: docker compose logs --no-color | tail -200

      - name: Tear down
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v

  # ── Terraform: validate is not enough (dynamic blocks are unevaluated), so
  #    also plan against a mock provider config where possible.
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform/cloudrun
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
