name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  # ── Static checks: fast, no services ────────────────────────────────────────
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Ruff check
        run: uv run ruff check src tests examples scripts

      - name: Ruff format
        run: uv run ruff format --check src tests examples scripts

      - name: Import contracts
        run: uv run lint-imports

      - name: mypy (strict)
        run: uv run mypy src

  # ── Unit tests: no database required ────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Run unit tests
        run: uv run pytest -m 'not pg' --no-cov

  # ── Integration + coverage: real Postgres/Redis service containers ─────────
  integration:
    name: Integration & coverage
    runs-on: ubuntu-latest
    needs: [lint, unit]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U synapse -d synapse"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      SYNAPSE_DATABASE_URL: postgresql+asyncpg://synapse:synapse@localhost:5433/synapse
      SYNAPSE_REDIS_URL: ""
      SYNAPSE_SECRET_KEY: ci-only-secret-key-32-bytes-minimum-ok!

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Run full suite with coverage gate
        run: uv run pytest -m "" --cov=src/synapse_saas --cov-fail-under=80

  # ── Integration under real RLS: API as a NOBYPASSRLS role, policies live ───
  integration-rls:
    name: Integration (RLS-subject role)
    runs-on: ubuntu-latest
    needs: [lint, unit]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U synapse -d synapse"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      OWNER_URL: postgresql+asyncpg://synapse:synapse@localhost:5433/synapse
      APP_URL: postgresql+asyncpg://synapse_app:synapse_app@localhost:5433/synapse
      SYNAPSE_REDIS_URL: ""
      SYNAPSE_SECRET_KEY: ci-only-secret-key-32-bytes-minimum-ok!

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Migrate as owner
        run: SYNAPSE_DATABASE_URL="$OWNER_URL" uv run synapse-cli migrate

      - name: Provision the RLS-subject role
        run: >-
          SYNAPSE_DATABASE_URL="$OWNER_URL" SYNAPSE_APP_ROLE_PASSWORD=synapse_app
          uv run synapse-cli db provision-app-role --role synapse_app

      - name: Run integration suite as the subject role
        env:
          SYNAPSE_DATABASE_URL: postgresql+asyncpg://synapse_app:synapse_app@localhost:5433/synapse
          SYNAPSE_WORKER_DATABASE_URL: postgresql+asyncpg://synapse:synapse@localhost:5433/synapse
          SYNAPSE_TENANT_ISOLATION: app_and_rls
        run: uv run pytest -m pg --no-cov

  # ── Console build: catch TS/Next errors ────────────────────────────────────
  web:
    name: Console build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # ── Contract: routers ⇒ contracts/openapi-v1.json must be committed ────────
  contract:
    name: REST contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: OpenAPI contract is up to date
        env:
          SYNAPSE_REDIS_URL: ""
        run: uv run python scripts/export_openapi.py --check

  # ── Images: no secrets baked, correct entrypoints, writable storage ────────
  docker-image:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t synapse-api:ci .

      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t synapse-worker:ci .

      - name: Assert no env files or dev artifacts in the API image
        run: |
          docker run --rm synapse-api:ci sh -c '
            set -e
            test ! -e /app/.env
            test ! -e /app/.git
            test ! -d /app/apps/web
            test ! -d /app/tests
            test -w /data/storage
            echo "image hygiene OK"'

      - name: Assert entrypoints
        run: |
          test "$(docker inspect --format '{{join .Config.Cmd " "}}' synapse-api:ci)" = "synapse-api"
          test "$(docker inspect --format '{{join .Config.Cmd " "}}' synapse-worker:ci)" = "synapse-worker"

      - name: API image starts (health)
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SYNAPSE_DATABASE_URL=postgresql+asyncpg://x:x@localhost:1/x \
            -e SYNAPSE_REDIS_URL= -e SYNAPSE_AUTO_SYNC_PLANS=false synapse-api:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/healthz && break; sleep 1; done
          curl -sf http://localhost:8000/healthz
          docker rm -f api

  # ── Terraform: validate is not enough (dynamic blocks are unevaluated), so
  #    also plan against a mock provider config where possible.
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform/cloudrun
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
