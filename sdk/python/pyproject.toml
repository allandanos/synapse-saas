[project]
name = "synapse-saas-client"
version = "0.1.0"
description = "Python client SDK for the Synapse SaaS Framework API"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synapse_saas_client"]
